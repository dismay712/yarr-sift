name: Build Releases
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  build_macos:
    name: Build for macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Build GUI
      uses: ./.github/actions/prepare
      with:
        id: darwin_${{ matrix.arch }}_gui
        cmd: make darwin_${{ matrix.arch }}_gui
        out: out/darwin_${{ matrix.arch }}_gui/yarr.app
    - name: Build CLI
      uses: ./.github/actions/prepare
      with:
        id: darwin_${{ matrix.arch }}
        cmd: make darwin_${{ matrix.arch }}
        out: out/darwin_${{ matrix.arch }}/yarr

  build_windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Build amd64 gui
      uses: ./.github/actions/prepare
      with:
        id: windows_amd64_gui
        cmd: make SHELL=bash windows_amd64_gui
        out: out/windows_amd64_gui/yarr.exe

  build_multi_cli:
    name: Build for Windows/Linux (CLI)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.14.0
    - name: Build linux/amd64
      uses: ./.github/actions/prepare
      with:
        id: linux_amd64
        cmd: make linux_amd64
        out: out/linux_amd64/yarr
    - name: Build linux/arm64
      uses: ./.github/actions/prepare
      with:
        id: linux_arm64
        cmd: make linux_arm64
        out: out/linux_arm64/yarr
    - name: Build linux/armv7
      uses: ./.github/actions/prepare
      with:
        id: linux_armv7
        cmd: make linux_armv7
        out: out/linux_armv7/yarr
    - name: Build windows/amd64
      uses: ./.github/actions/prepare
      with:
        id: windows_amd64
        cmd: make windows_amd64
        out: out/windows_amd64/yarr.exe
    - name: Build windows/arm64
      uses: ./.github/actions/prepare
      with:
        id: windows_arm64
        cmd: make windows_arm64
        out: out/windows_arm64/yarr.exe

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build_macos, build_windows, build_multi_cli]
    permissions:
      contents: write
    steps:
    - name: Download binary artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '{darwin,linux,windows}_*'
        path: artifacts
    - name: Package release archives
      run: |
        mkdir dist
        for archive in artifacts/*/*.tar; do
          tar -xf "$archive"
        done
        for dir in out/*; do
          (cd "$dir" && zip -qr "../../dist/yarr-sift_${dir##*/}.zip" .)
        done
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: Yarr Sift ${{ inputs.version }}
        tag_name: ${{ inputs.version }}
        target_commitish: ${{ github.sha }}
        draft: false
        prerelease: ${{ contains(inputs.version, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: dist/*.zip
